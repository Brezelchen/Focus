<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb199"/>
      <stop offset="0.5" stop-color="#ff8e9e"/>
      <stop offset="1" stop-color="#a17cff"/>
